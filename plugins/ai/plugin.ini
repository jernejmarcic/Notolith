; noteAppC AI plugin (docs/PLUGINS.md, Tier 2) - a local Ollama server, or an
; OpenAI-compatible / Anthropic HTTP API. Configuration (provider, base URL,
; model, which environment variable holds a key) lives outside the vault in
; $XDG_CONFIG_HOME/noteAppC/plugins/ai/ai.ini - see AiConfig.h. The key itself is never
; written to any file, only read from the named environment variable at call
; time, and only once this plugin's `network` permission is granted.
[plugin]
id = ai
name = AI
version = 0.1.0
api = 3
engine = native
library = libai.so
; A language model call takes seconds to minutes, not milliseconds - well
; under the 300000ms (5 min) ceiling PluginManifest::load() clamps to.
; ai.ini's own [ai] timeout-ms (default 120000) should stay comfortably
; under this, so a slow call fails cleanly on its own timeout instead of
; PluginHost killing the whole host process on this one.
timeout-ms = 180000
; Only these two names are ever forwarded, and only once network is granted
; (PluginHost::sandboxArguments) - if ai.ini's api-key-env names anything
; else, add it here too.
env-passthrough = ANTHROPIC_API_KEY, OPENAI_API_KEY

[provides]
commands = summarize, ask, ask-question, rewrite, continue, translate, proofread, list-models
code-blocks = ai

[commands]
summarize = Summarize this note
ask = Ask about the selection
ask-question = AI: Ask a question
rewrite = Rewrite the selection
continue = Continue writing
translate = Translate the selection, or the note into a new note
proofread = Proofread the selection
list-models = List available models (Ollama)

[permissions]
read-notes = true
write-notes = true
network = true
clipboard = false
