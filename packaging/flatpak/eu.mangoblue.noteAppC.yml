# Flatpak build of the working tree two levels up. Not yet built: this
# machine has no flatpak-builder. To try it (from packaging/flatpak, build
# directories under /tmp because ~/Documents is synced):
#
#   flatpak install --user flathub org.kde.Sdk//6.9 org.kde.Platform//6.9 org.flatpak.Builder
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       --state-dir=/tmp/noteAppC-flatpak-state /tmp/noteAppC-flatpak eu.mangoblue.noteAppC.yml
#
# Flatpak builds offline, so the three dependencies CMake would fetch are
# sources here instead, pinned to the same commits as the root CMakeLists.txt,
# and FETCHCONTENT_SOURCE_DIR_* points CMake at them. That skips FetchContent's
# PATCH_COMMAND, so the two patch scripts run as their own step.
#
# PDF embeds are off: poppler is not in the KDE runtime and is a large module
# to build. Everything else is on.
app-id: eu.mangoblue.noteAppC
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: noteAppC
rename-desktop-file: noteAppC.desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio # audio and video embeds
  - --filesystem=home # vaults live anywhere under home
modules:
  - name: yaml-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DYAML_CPP_BUILD_TESTS=OFF
      - -DYAML_CPP_BUILD_TOOLS=OFF
      - -DYAML_CPP_FORMAT_SOURCE=OFF
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: git
        url: https://github.com/jbeder/yaml-cpp.git
        commit: 56e3bb550c91fd7005566f19c079cb7a503223cf # yaml-cpp-0.9.0

  - name: hunspell
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/hunspell/hunspell.git
        commit: c5f98152a274e25b5107101104bef632b83a0cc9 # v1.7.3
      - type: script
        dest-filename: autogen.sh
        commands:
          - autoreconf -vfi

  - name: litehtml
    buildsystem: cmake-ninja
    config-opts:
      - -DLITEHTML_BUILD_TESTING=OFF
      - -DLITEHTML_ENABLE_LINT=OFF
      - -DBUILD_SHARED_LIBS=ON
    sources:
      # No v0.10 tag upstream; the code builds against the 0.10 API that
      # Arch packages, and this is master as of 2026-09-23. Check it still is.
      - type: git
        url: https://github.com/litehtml/litehtml.git
        commit: b58fd1023244557949d859b61dd52149420b8762

  - name: noteAppC
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DNOTEAPPC_WITH_PDF=OFF
      - -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - -DFETCHCONTENT_SOURCE_DIR_MD4QT=/run/build/noteAppC/deps/md4qt
      - -DFETCHCONTENT_SOURCE_DIR_TINYXML2=/run/build/noteAppC/deps/tinyxml2
      - -DFETCHCONTENT_SOURCE_DIR_MICROTEX=/run/build/noteAppC/deps/microtex
    sources:
      - type: dir
        path: ../..
        skip:
          - .claude
      - type: git
        url: https://invent.kde.org/libraries/md4qt.git
        commit: e48716a41c1cf7f91b130fe3d3cc1c524e3b404a # v5.1.4
        dest: deps/md4qt
      - type: git
        url: https://github.com/leethomason/tinyxml2.git
        commit: 321ea883b7190d4e85cae5512a12e5eaa8f8731f # 10.0.0
        dest: deps/tinyxml2
      - type: git
        url: https://github.com/NanoMichael/MicroTeX.git
        commit: 0e3707f6dafebb121d98b53c64364d16fefe481d
        dest: deps/microtex
      - type: shell
        commands:
          - cd deps/md4qt && sh ../../cmake/patch-md4qt.sh
          - cd deps/microtex && sh ../../cmake/patch-microtex.sh
