; example plugin (docs/PLUGINS.md, Tier 2) - also the end-to-end test
; fixture for tests/test_plugins_host.cpp. "hang" and "crash" exist only for
; that suite (PluginHost's timeout-kill and crash-survival paths); a real
; plugin would not ship commands whose entire job is to misbehave.
[plugin]
id = word-stats
name = Word stats
version = 0.1.0
api = 1
engine = native
library = libword-stats.so

[provides]
commands = count-words, hang, crash
code-blocks = calc

[permissions]
read-notes = true
write-notes = false
network = false
clipboard = false
